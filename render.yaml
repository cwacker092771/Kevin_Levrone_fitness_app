databases:
  - name: levrone-fitness-db
    plan: free
    databaseName: levrone_fitness
    user: levrone

services:
  - type: web
    name: levrone-protocol
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: levrone-fitness-db
          property: connectionString
      - key: NODE_ENV
        value: production
